<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホ料金 節約診断シミュレーター｜年間いくら損してる？</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #e5e7eb;
      --accent: #111111;
      --highlight: #d93025;
      --save: #137333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 16px 60px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .value-display {
      float: right;
      font-weight: 800;
      color: var(--accent);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .radio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .radio-grid input { display: none; }
    .radio-grid label {
      text-align: center;
      padding: 10px 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      margin: 0;
      transition: all 0.15s;
    }
    .radio-grid input:checked + label {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.calc-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button.calc-btn:hover { opacity: 0.88; }
    #result { display: none; }
    .result-box {
      text-align: center;
      padding: 16px;
      background: #f3f4f6;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .result-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }
    .result-amount {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--save);
      margin: 4px 0;
    }
    .result-sub {
      font-size: 0.85rem;
      color: var(--text);
    }
    .plan-card {
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .plan-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .plan-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .plan-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--highlight);
      margin-bottom: 10px;
    }
    .plan-desc {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .cta-btn {
      display: block;
      text-align: center;
      background: var(--save);
      color: #fff;
      text-decoration: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .cta-btn:hover { opacity: 0.9; }
    .note {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>スマホ料金 節約診断ツール</h1>
      <p class="subtitle">10秒入力で「年間いくら払いすぎているか」を計算します</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label>現在の月額スマホ代 <span class="value-display" id="billVal">7,000円</span></label>
        <input type="range" id="currentBill" min="1000" max="15000" step="500" value="7000">
      </div>

      <div class="form-group">
        <label>毎月のデータ使用量（ギガ数）</label>
        <div class="radio-grid">
          <input type="radio" name="dataUsage" id="d1" value="light">
          <label for="d1">〜3GB<br><small>Wi-Fi中心</small></label>

          <input type="radio" name="dataUsage" id="d2" value="medium" checked>
          <label for="d2">3〜20GB<br><small>標準的</small></label>

          <input type="radio" name="dataUsage" id="d3" value="heavy">
          <label for="d3">20GB〜無制限<br><small>動画・SNS多め</small></label>
        </div>
      </div>

      <div class="form-group">
        <label>家族の人数（まとめて見直す場合） <span class="value-display" id="peopleVal">1人</span></label>
        <input type="range" id="peopleCount" min="1" max="5" step="1" value="1">
      </div>

      <button class="calc-btn" onclick="diagnose()">節約額を診断する</button>
    </div>

    <div class="card" id="result">
      <div class="result-box">
        <div class="result-label">見直しで浮く金額（年間）</div>
        <div class="result-amount" id="yearlySave">0円</div>
        <div class="result-sub" id="fiveYearSave"></div>
      </div>

      <div class="plan-card" id="planCard">
        <span class="plan-badge" id="planBadge">あなたに最適なプラン</span>
        <div class="plan-title" id="planTitle"></div>
        <div class="plan-price" id="planPrice"></div>
        <p class="plan-desc" id="planDesc"></p>
        <!-- ↓ ここにASPのアフィリエイトリンクが入ります -->
        <a href="#" target="_blank" rel="noopener noreferrer" class="cta-btn" id="planLink">公式サイトで詳細を見る →</a>
      </div>

      <p class="note">※本ツールの試算は目安です。端末代金の分割払いは含みません。※PRを含みます。</p>
    </div>
  </div>

  <script>
    const billInput = document.getElementById('currentBill');
    const billVal = document.getElementById('billVal');
    const peopleInput = document.getElementById('peopleCount');
    const peopleVal = document.getElementById('peopleVal');

    billInput.addEventListener('input', () => {
      billVal.textContent = Number(billInput.value).toLocaleString() + '円';
    });
    peopleInput.addEventListener('input', () => {
      peopleVal.textContent = peopleInput.value + '人';
    });

    // ★ここをASPの提携案件に合わせて書き換えてください★
    const plans = {
      light: {
        title: 'ライト層向け格安プラン（3GB）',
        price: 990,
        priceText: '月額 990円（税込）〜',
        desc: 'Wi-Fi環境がメインなら大手キャリアは払いすぎです。3GBプランに乗り換えるだけで通信品質を維持しつつ大幅に固定費を下げられます。',
        url: 'https://example.com/affiliate-light' // ← A8.netやもしものリンクに変更
      },
      medium: {
        title: 'コスパ最強クラス（20GB〜30GB）',
        price: 2970,
        priceText: '月額 2,970円（税込）',
        desc: '外でSNSや動画をほどほどに見る方に最適。5分以内の国内通話無料が付いているプランも多く、最も失敗が少ない定番の乗り換え先です。',
        url: 'https://example.com/affiliate-medium' // ← A8.netやもしものリンクに変更
      },
      heavy: {
        title: 'データ無制限プラン',
        price: 3278,
        priceText: '月額 3,278円（税込・上限）',
        desc: 'ギガを気にせず動画やテザリングを使いたい方向け。どれだけ使っても月額3,278円が上限なので、大手無制限プランの半額以下になります。',
        url: 'https://example.com/affiliate-heavy' // ← A8.netやもしものリンクに変更
      }
    };

    function diagnose() {
      const currentBill = Number(billInput.value);
      const people = Number(peopleInput.value);
      const usage = document.querySelector('input[name="dataUsage"]:checked').value;
      const rec = plans[usage];

      const monthlyDiff = Math.max(0, currentBill - rec.price) * people;
      const yearlyDiff = monthlyDiff * 12;
      const fiveYearDiff = yearlyDiff * 5;

      const yearlyEl = document.getElementById('yearlySave');
      const fiveYearEl = document.getElementById('fiveYearSave');

      if (yearlyDiff > 0) {
        yearlyEl.textContent = '+' + yearlyDiff.toLocaleString() + '円 / 年';
        fiveYearEl.textContent = '5年間続けると 約' + fiveYearDiff.toLocaleString() + '円 の節約になります';
      } else {
        yearlyEl.textContent = 'すでに最安水準です！';
        fiveYearEl.textContent = '今のプランを継続して問題ありません';
      }

      document.getElementById('planTitle').textContent = rec.title;
      document.getElementById('planPrice').textContent = rec.priceText;
      document.getElementById('planDesc').textContent = rec.desc;
      document.getElementById('planLink').href = rec.url;

      const resultEl = document.getElementById('result');
      resultEl.style.display = 'block';
      resultEl.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
